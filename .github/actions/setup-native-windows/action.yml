name: Windows native toolchain
description: Prepare LLVM MinGW, WinFsp SDK, the pinned Rust toolchain and build caches.
inputs:
  cache-key:
    description: Separate release builds from native contract builds.
    required: true
runs:
  using: composite
  steps:
    - name: Cache LLVM MinGW
      id: llvm
      uses: actions/cache@v5
      with:
        path: .tools/llvm-mingw-20261006-ucrt-x86_64
        key: llvm-mingw-windows-x86_64-20261006-ucrt
    - name: Download LLVM MinGW
      if: steps.llvm.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force .tools | Out-Null
        Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip' -OutFile .tools/llvm.zip
        Expand-Archive .tools/llvm.zip -DestinationPath .tools
    - name: Prepare Windows native dependencies
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $channel = python -c 'import tomllib; print(tomllib.load(open("native/filesystem/rust-toolchain.toml", "rb"))["toolchain"]["channel"])'
        $toolchain = "$channel-x86_64-pc-windows-gnullvm"
        rustup toolchain install $toolchain --profile minimal
        if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
        Add-Content -Path $env:GITHUB_ENV -Value "RUSTUP_TOOLCHAIN=$toolchain"
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_winfsp.ps1 -Developer
        if ($LASTEXITCODE -ne 0) { throw 'WinFsp installation failed' }
    - uses: Swatinem/rust-cache@v2
      with:
        key: windows-agentfs-llvm-20261006-${{ inputs.cache-key }}
        cache-workspace-crates: true
        workspaces: |
          native/filesystem -> ../../.tools/agentfs/target
          native/vfs -> ../../.tools/agentfs/target
