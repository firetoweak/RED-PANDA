name: Process verification environment
description: Prepare Python, the built runtime, platform runtime dependencies and the cached verification virtualenv.
inputs:
  artifact:
    description: Built runtime and tools shared by the build job.
    required: true
  node:
    description: Also prepare Node.js for groups that run web tooling.
    default: 'false'
runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version
    - uses: actions/setup-node@v7
      if: inputs.node == 'true'
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: .
    - name: Prepare Linux runtime dependencies and executable permissions
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y fuse3
        sudo modprobe fuse
        chmod +x redpanda/filesystem/bin/redpanda-agentfs .tools/bin/fd .tools/bin/rg
        echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
    - name: Prepare Windows runtime dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_winfsp.ps1
        if ($LASTEXITCODE -ne 0) { throw 'WinFsp installation failed' }
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $PWD '.tools\bin')
        # The default temp directory is on the throttled OS disk; tests keep
        # journals and git stores there, so use the runner temp disk instead.
        Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
        Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
    - id: venv
      uses: actions/cache@v5
      with:
        path: redpanda-env
        key: process-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.lock') }}
    - name: Prepare verification environment
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: python -m venv redpanda-env
