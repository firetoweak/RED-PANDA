name: Linux native toolchain
description: Prepare FUSE, the pinned Rust toolchain and the Cargo build cache.
inputs:
  cache-key:
    description: Separate release builds from native contract builds.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare Linux native dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential fuse3
        sudo modprobe fuse
        channel=$(python -c 'import tomllib; print(tomllib.load(open("native/filesystem/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        key: linux-agentfs-${{ inputs.cache-key }}
        cache-workspace-crates: true
        workspaces: |
          native/filesystem -> ../../.tools/agentfs/target
          native/vfs -> ../../.tools/agentfs/target
