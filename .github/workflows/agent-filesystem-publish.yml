name: Agent File System publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish filesystem and execution runtimes (requires green Agent File System Linux + Windows on this SHA)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-filesystem-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Require green Linux and Windows builds for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          mkdir -p dist/sandbox
          for pair in "agent-filesystem-linux.yml:agent-filesystem-linux-x86_64" "agent-filesystem-windows.yml:agent-filesystem-windows-x86_64"; do
            wf="${pair%%:*}"
            artifact="${pair##*:}"
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$sha" --status completed --limit 20 \
              --json databaseId,conclusion,headSha \
              --jq "[.[] | select(.conclusion==\"success\" and .headSha==\"$sha\")][0].databaseId // empty")
            if [ -z "$run_id" ]; then
              echo "::error::No successful '$wf' run found for $sha"
              exit 1
            fi
            echo "Using $wf run $run_id for artifact $artifact"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir dist/sandbox
          done
          ls -la dist/sandbox
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'from scripts.sandbox_runtime import ROOT, release_config; print(release_config(ROOT)["version"])')
          cd dist/sandbox
          sha256sum --check *.sha256
          gh release create "sandbox-v$version" *.zip *.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Agent File System runtime $version" --notes "Agent File System runtimes for Windows x64 and Linux x64, plus the Windows task execution runtime. These components do not provide operating system sandbox isolation. Linux requires glibc 2.35+, FUSE 3 and /dev/fuse access. Windows requires the WinFsp driver. Rust, LLVM and development SDKs are not required. See native/sandbox/README.md for installation."
