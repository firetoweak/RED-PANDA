name: agentFS Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentfs-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  FD_VERSION: '10.2.0'
  RG_VERSION: '14.1.1'

jobs:
  build:
    name: agentFS build (linux-x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-native-linux
        with:
          cache-key: build
      - name: Prepare command line tools for process verification
        shell: bash
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/.tools/bin"
          mkdir -p "$tools"

          curl -fsSL "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp
          install -m 755 "/tmp/fd-v${FD_VERSION}-x86_64-unknown-linux-gnu/fd" "$tools/fd"

          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          install -m 755 "/tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" "$tools/rg"

          echo "$tools" >> "$GITHUB_PATH"
          "$tools/fd" --version
          "$tools/rg" --version

      - name: Build agentFS for Linux
        id: build
        run: python scripts/build_agentfs.py
      - name: Package agentFS runtime
        run: python -m scripts.agentfs_runtime package --platform linux-x86_64
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: agentFS-linux-x86_64
          path: dist/agentFS/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Share built runtime and tools with process verification
        uses: actions/upload-artifact@v7
        with:
          name: agentFS-linux-ci-inputs
          path: |
            redpanda/filesystem/bin/
            dist/agentFS/
            .tools/bin/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Linux native contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-native-linux
        with:
          cache-key: contracts
      - name: Verify tracked filesystem mutation boundaries
        working-directory: native/filesystem
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/agentfs/target
        run: cargo test --locked --test tracking_contracts
      - name: Verify agentFS core contracts
        working-directory: native/vfs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/agentfs/target
        run: cargo test --locked -p vfs-core --lib --tests

  process:
    name: Linux process (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: compact
            workers: 2
          - group: supervisor
            workers: 4
          - group: filesystem
            workers: 2
          - group: execution
            workers: 2
          - group: integration
            workers: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        if: matrix.group == 'execution'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: agentFS-linux-ci-inputs
          path: .
      - name: Prepare Linux runtime dependencies and executable permissions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse
          chmod +x redpanda/filesystem/bin/redpanda-agentfs .tools/bin/fd .tools/bin/rg
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Prepare verification environment
        run: python -m venv redpanda-env
      - name: Verify process contracts
        run: redpanda-env/bin/python scripts/ci.py process --process-group ${{ matrix.group }} --workers ${{ matrix.workers }}
      - name: Verify installation contracts
        if: matrix.group == 'integration'
        run: >-
          redpanda-env/bin/python -m pytest tests/scripts/test_agentfs_runtime.py
          tests/scripts/test_install_winfsp.py --junitxml=.tools/test-results/installation.xml
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-process-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14

  verify:
    # Preserve the required check; all Linux branches must pass.
    name: agentFS build and verify (linux-x86_64)
    needs: [build, native, process]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Linux build and verification
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$PROCESS_RESULT" = success
