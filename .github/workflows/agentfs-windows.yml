name: agentFS Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentfs-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  FD_VERSION: '10.2.0'
  RG_VERSION: '14.1.1'

jobs:
  build:
    name: agentFS build (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-native-windows
        with:
          cache-key: build
      - name: Prepare command line tools for process verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $PWD '.tools\bin'
          New-Item -ItemType Directory -Force $tools | Out-Null

          $fdZip = Join-Path $PWD '.tools\fd.zip'
          $fdUrl = "https://github.com/sharkdp/fd/releases/download/v$env:FD_VERSION/fd-v$env:FD_VERSION-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $fdUrl -OutFile $fdZip
          Expand-Archive $fdZip -DestinationPath .tools\fd-extract -Force
          $fdExe = Get-ChildItem -Path .tools\fd-extract -Recurse -Filter fd.exe | Select-Object -First 1
          Copy-Item $fdExe.FullName (Join-Path $tools 'fd.exe') -Force

          $rgZip = Join-Path $PWD '.tools\rg.zip'
          $rgUrl = "https://github.com/BurntSushi/ripgrep/releases/download/$env:RG_VERSION/ripgrep-$env:RG_VERSION-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $rgUrl -OutFile $rgZip
          Expand-Archive $rgZip -DestinationPath .tools\rg-extract -Force
          $rgExe = Get-ChildItem -Path .tools\rg-extract -Recurse -Filter rg.exe | Select-Object -First 1
          Copy-Item $rgExe.FullName (Join-Path $tools 'rg.exe') -Force

          Add-Content -Path $env:GITHUB_PATH -Value $tools
          & (Join-Path $tools 'fd.exe') --version
          & (Join-Path $tools 'rg.exe') --version
      - name: Build agentFS for Windows
        id: build
        run: python scripts/build_agentfs.py --llvm-dir .tools/llvm-mingw-20261006-ucrt-x86_64/bin
      - name: Package agentFS runtime
        run: python -m scripts.agentfs_runtime package --platform windows-x86_64
      - name: Package Windows task execution runtime
        run: python -c "from pathlib import Path; from scripts.execution_runtime import package; package(Path.cwd(), Path('dist/agentFS'))"
      - name: Compile gate fault-injection runtime
        run: python tests/fixtures/windows_gate.py
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: agentFS-windows-x86_64
          path: dist/agentFS/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Share built runtimes and tools with process verification
        uses: actions/upload-artifact@v7
        with:
          name: agentFS-windows-ci-inputs
          path: |
            redpanda/filesystem/bin/
            redpanda/execution/bin/
            dist/agentFS/
            .tools/bin/
            .tools/test-fixtures/windows-gate/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    name: Windows native contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-native-windows
        with:
          cache-key: contracts
      - name: Verify agentFS native contracts
        shell: pwsh
        run: |
          @'
          import subprocess
          from scripts.build_agentfs import ROOT, prepare_environment
          prepared = prepare_environment(ROOT / '.tools/llvm-mingw-20261006-ucrt-x86_64/bin')
          environment = prepared.variables
          environment['CARGO_TARGET_DIR'] = str(ROOT / '.tools/agentfs/target')
          subprocess.run([prepared.rustup, 'run', prepared.toolchain, 'cargo', 'test', '--locked',
              '--manifest-path', str(ROOT / 'native/filesystem/Cargo.toml'),
              '--target', 'x86_64-pc-windows-gnullvm', '--test', 'tracking_contracts'],
              env=environment, check=True)
          subprocess.run([prepared.rustup, 'run', prepared.toolchain, 'cargo', 'test', '--locked',
              '--manifest-path', str(ROOT / 'native/vfs/Cargo.toml'), '-p', 'vfs-core',
              '--target', 'x86_64-pc-windows-gnullvm', '--lib', '--tests'],
              env=environment, check=True)
          '@ | python -

  process:
    name: Windows process (${{ matrix.group }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [compact, supervisor, filesystem, execution, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-process
        with:
          artifact: agentFS-windows-ci-inputs
          node: ${{ matrix.group == 'execution' }}
      - name: Verify process contracts
        run: redpanda-env/Scripts/python.exe scripts/ci.py process --process-group ${{ matrix.group }} --workers 4
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-process-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14

  gate:
    name: Windows gate and installation contracts
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/download-artifact@v7
        with:
          name: agentFS-windows-ci-inputs
          path: .
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify gate and installation contracts without build toolchains
        run: >-
          python -m pytest --all tests/execution/test_windows_gate_process.py
          tests/scripts/test_agentfs_runtime.py tests/scripts/test_install_winfsp.py
          --gate-runtime .tools/test-fixtures/windows-gate/redpanda-command.exe
          --durations=20 --junitxml=.tools/test-results/gate-installation.xml
      - name: Upload gate and installation report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-gate-installation
          path: .tools/test-results/*.xml
          retention-days: 14

  verify:
    # Preserve the required check; all Windows branches must pass.
    name: agentFS build and verify (windows-x86_64)
    needs: [build, native, process, gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Windows build and verification
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$PROCESS_RESULT" = success
          test "$GATE_RESULT" = success
