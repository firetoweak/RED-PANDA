name: Sandbox runtime

on:
  pull_request:
    branches: [main]
    paths: ['native/**', '.cargo/**', 'scripts/build_sandbox.py', 'scripts/sandbox_runtime.py', 'tests/scripts/test_sandbox_runtime*', '.github/workflows/sandbox.yml']
  push:
    branches: [main]
    paths: ['native/**', '.cargo/**', 'scripts/build_sandbox.py', 'scripts/sandbox_runtime.py', 'tests/scripts/test_sandbox_runtime*', '.github/workflows/sandbox.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both runtime packages to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build and verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Prepare Linux build and runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fuse3
          sudo modprobe fuse
          channel=$(python -c 'import tomllib; print(tomllib.load(open("native/sandbox/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal
      - name: Prepare Windows build and runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = python -c 'import tomllib; print(tomllib.load(open("native/sandbox/rust-toolchain.toml", "rb"))["toolchain"]["channel"])'
          rustup toolchain install "$channel-x86_64-pc-windows-gnullvm" --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip' -OutFile .tools/llvm.zip
          Expand-Archive .tools/llvm.zip -DestinationPath .tools
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_winfsp.ps1 -Developer
          if ($LASTEXITCODE -ne 0) { throw 'WinFsp installation failed' }
      - name: Build Linux
        if: runner.os == 'Linux'
        run: python scripts/build_sandbox.py
      - name: Build Windows
        if: runner.os == 'Windows'
        run: python scripts/build_sandbox.py --llvm-dir .tools/llvm-mingw-20261006-ucrt-x86_64/bin
      - name: Package release build
        run: python -m scripts.sandbox_runtime package --platform ${{ matrix.platform }}
      - name: Prepare verification environment
        run: python -m pip install -r requirements.txt
      - name: Verify installation contracts
        run: python -m pytest tests/scripts/test_sandbox_runtime.py
      - name: Verify native runtime without Rust on PATH
        run: python -m pytest -m process tests/scripts/test_sandbox_runtime_process.py
      - uses: actions/upload-artifact@v7
        with:
          name: sandbox-${{ matrix.platform }}
          path: dist/sandbox/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@v8
        with:
          pattern: sandbox-*
          merge-multiple: true
          path: dist/sandbox
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'from scripts.sandbox_runtime import ROOT, release_config; print(release_config(ROOT)["version"])')
          cd dist/sandbox
          sha256sum --check *.sha256
          gh release create "sandbox-v$version" *.zip *.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sandbox runtime $version" --notes "Windows x64 and Linux x64 runtime packages. Linux requires glibc 2.35+, FUSE 3 and /dev/fuse access. Windows requires the WinFsp driver. Rust, LLVM and development SDKs are not required. See native/sandbox/README.md for installation."
