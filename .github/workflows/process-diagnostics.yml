name: Process diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/process-diagnostics.yml
      - scripts/ci.py
      - tests/conftest.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  process:
    name: Process diagnostics (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        group: [compact, supervisor, execution, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the runner temp disk on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Verify process contracts
        run: python scripts/ci.py process --process-group ${{ matrix.group }} --workers 2
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: process-${{ matrix.os }}-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14
