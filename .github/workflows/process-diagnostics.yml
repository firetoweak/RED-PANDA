name: Process diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/process-diagnostics.yml
      - scripts/ci.py
      - tests/conftest.py
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        default: all
        options: [all, ubuntu-latest, windows-latest, macos-15, macos-15-intel]
      group:
        description: Process group to verify
        type: choice
        default: all
        options: [all, compact, supervisor, execution, integration]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  process:
    name: Process diagnostics (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-latest","windows-latest","macos-15","macos-15-intel"]') }}
        group: ${{ fromJSON(inputs.group && inputs.group != 'all' && format('["{0}"]', inputs.group) || '["compact","supervisor","execution","integration"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the runner temp disk on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Allow the application Chrome sandbox on Ubuntu
        if: runner.os == 'Linux' && matrix.group == 'integration'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/konden-chrome.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile konden-ci-chrome "$GITHUB_WORKSPACE/.tools/runtime/chrome/chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/konden-chrome.apparmor"
      - name: Verify process contracts
        run: python scripts/ci.py process --process-group ${{ matrix.group }} --workers 2
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: process-${{ matrix.os }}-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14
