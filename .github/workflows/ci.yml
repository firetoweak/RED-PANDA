name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run default verification
        run: python scripts/ci.py python
      - name: Upload Python test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-${{ matrix.os }}
          path: .tools/test-results/*.xml
          retention-days: 14

  web-check:
    name: Web (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web-test, web-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run web verification
        run: python scripts/ci.py ${{ matrix.target }}

  web:
    name: Web
    needs: web-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful web tests and build
        env:
          WEB_RESULT: ${{ needs.web-check.result }}
        run: test "$WEB_RESULT" = success
