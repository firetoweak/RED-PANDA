name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.result }}
    steps:
      - uses: actions/github-script@v9
        id: classify
        with:
          script: |
            if (context.eventName !== 'pull_request') return false;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const isDocumentation = path => path.startsWith('docs/') || path === 'README.md';
            const docsOnly = files.length > 0 && files.every(file =>
              isDocumentation(file.filename) &&
              (!file.previous_filename || isDocumentation(file.previous_filename))
            );
            await core.summary.addRaw(docsOnly
              ? 'Documentation-only PR: code verification skipped.'
              : 'Code verification required.').write();
            return docsOnly;

  python:
    name: Python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run default verification
        run: python scripts/ci.py python smoke
      - name: Upload Python test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-${{ matrix.os }}
          path: .tools/test-results/*.xml
          retention-days: 14

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run web verification
        run: python scripts/ci.py web

  ci:
    name: CI
    needs: [changes, python, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful merge checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          EXPECTED_RESULT: ${{ needs.changes.outputs.docs_only == 'true' && 'skipped' || 'success' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$PYTHON_RESULT" = "$EXPECTED_RESULT"
          test "$WEB_RESULT" = "$EXPECTED_RESULT"
