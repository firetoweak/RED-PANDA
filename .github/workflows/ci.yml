name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.result }}
    steps:
      - uses: actions/github-script@v9
        id: classify
        with:
          script: |
            if (context.eventName !== 'pull_request') return false;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const isDocumentation = path => path.startsWith('docs/') || path === 'README.md';
            const docsOnly = files.length > 0 && files.every(file =>
              isDocumentation(file.filename) &&
              (!file.previous_filename || isDocumentation(file.previous_filename))
            );
            await core.summary.addRaw(docsOnly
              ? 'Documentation-only PR: code verification skipped.'
              : 'Code verification required.').write();
            return docsOnly;

  python:
    name: Python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run default verification
        run: python scripts/ci.py python
      - name: Upload Python test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-${{ matrix.os }}
          path: .tools/test-results/*.xml
          retention-days: 14

  process:
    name: Process (${{ matrix.os }}, ${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [compact, supervisor, execution, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        if: matrix.group == 'execution'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the runner temp disk on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # The default temp directory is on the throttled OS disk; tests keep journals and git stores there.
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Verify process contracts
        run: python scripts/ci.py process --process-group ${{ matrix.group }} --workers 2
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: process-${{ matrix.os }}-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14

  process-result:
    # Single required check for all process groups on both platforms.
    name: Process
    needs: [changes, process]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful process verification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
          EXPECTED_RESULT: ${{ needs.changes.outputs.docs_only == 'true' && 'skipped' || 'success' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$PROCESS_RESULT" = "$EXPECTED_RESULT"

  web-check:
    name: Web (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web-test, web-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run web verification
        run: python scripts/ci.py ${{ matrix.target }}

  web:
    name: Web
    needs: [changes, web-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful web tests and build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web-check.result }}
          EXPECTED_RESULT: ${{ needs.changes.outputs.docs_only == 'true' && 'skipped' || 'success' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$WEB_RESULT" = "$EXPECTED_RESULT"
