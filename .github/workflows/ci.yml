name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run default verification
        run: python scripts/ci.py python
      - name: Upload Python test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-${{ matrix.os }}
          path: .tools/test-results/*.xml
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run web verification
        run: python scripts/ci.py web

  process:
    name: Process (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        group: [compact, supervisor, execution, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the runner temp disk on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Allow the application Chrome sandbox on Ubuntu
        if: runner.os == 'Linux' && matrix.group == 'integration'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/konden-chrome.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile konden-ci-chrome "$GITHUB_WORKSPACE/.tools/runtime/chrome/chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/konden-chrome.apparmor"
      - name: Verify process contracts
        run: python scripts/ci.py process --process-group ${{ matrix.group }} --workers 2
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: process-${{ matrix.os }}-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14

  ci:
    name: CI
    needs: [python, web, process]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful merge checks
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$PROCESS_RESULT" = success
