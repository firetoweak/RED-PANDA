[package]
name = "redpanda-agentfs"
version = "0.5.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
vfs-core = { path = "../vfs/crates/vfs-core" }

[target.'cfg(windows)'.dependencies]
vfs-mount = { path = "../vfs/crates/vfs-mount", features = ["winfsp"] }

[target.'cfg(unix)'.dependencies]
vfs-mount = { path = "../vfs/crates/vfs-mount" }

[lints.clippy]
await_holding_lock = "deny"

[dev-dependencies]
tempfile = "3"

# Cargo patches are resolved from the build root; keep the service and VFS
# workspace on the same upstream SQLite 3.53.4 source.
[patch.crates-io]
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "901f9946efdaaa289e6b1c5bd56dc67f4b651e51" }
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite", rev = "901f9946efdaaa289e6b1c5bd56dc67f4b651e51" }
