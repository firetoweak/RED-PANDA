<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">人的插话可以越过未返回工具，结果随后继续接入</title>
  <desc id="desc">旧决策提交后开始执行工具。人的更正在工具等待中接纳，下一次模型决策可越过旧工具，冻结时明确结果尚未知。工具随后返回并提交事实，再触发后续判断，不因已回复人的插话而遗失。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#708399"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
  </defs>
  <rect width="1280" height="860" fill="#fff"/>
  <!-- Backgrounds, connections and nodes are separate for editable layering. -->
  <rect x="40" y="136" width="1200" height="148" rx="16" fill="#f5f2fb" stroke="#b9aad4" stroke-width="1.5"/>
  <text x="64" y="172" font-size="22" text-anchor="start" font-weight="700" fill="#20354a">人的输入</text>
  <rect x="40" y="314" width="1200" height="184" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="64" y="350" font-size="22" text-anchor="start" font-weight="700" fill="#20354a">模型决策</text>
  <rect x="40" y="528" width="1200" height="158" rx="16" fill="#eff8f3" stroke="#8cbca2" stroke-width="1.5"/>
  <text x="64" y="564" font-size="22" text-anchor="start" font-weight="700" fill="#20354a">工具执行</text>
  <path d="M330 458 V574" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440 613 H800" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="601" font-size="17" text-anchor="middle" font-weight="400" fill="#60758b">继续执行，不因插话自动撤销</text>
  <path d="M621 256 V370" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440 414 H476" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M766 414 H930" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="401" font-size="17" text-anchor="middle" font-weight="400" fill="#60758b">后续决策</text>
  <path d="M1065 574 V458" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="54" font-size="30" text-anchor="start" font-weight="700" fill="#20354a">人的插话可以越过未返回工具，结果随后继续接入</text>
  <text x="40" y="88" font-size="18" text-anchor="start" font-weight="400" fill="#60758b">示例：旧工具在新请求冻结后才返回。同一 Session 的模型决策仍串行。</text>
  <rect x="476" y="178" width="290" height="78" rx="16" fill="#f5f2fb" stroke="#b9aad4" stroke-width="1.5"/>
  <text x="621.0" y="212.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="488,184,266,66">收到人的更正</text>
  <text x="621.0" y="242.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="488,184,266,66">立即写入 Journal</text>
  <rect x="220" y="370" width="220" height="88" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="330.0" y="409.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="232,376,196,76">旧决策提交</text>
  <text x="330.0" y="439.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="232,376,196,76">随后派发工具</text>
  <rect x="476" y="370" width="290" height="88" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="621.0" y="409.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="488,376,266,76">下一次判断插话</text>
  <text x="621.0" y="439.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="488,376,266,76">冻结时旧结果尚未返回</text>
  <rect x="930" y="370" width="270" height="88" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="1065.0" y="409.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="942,376,246,76">后续判断工具结果</text>
  <text x="1065.0" y="439.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="942,376,246,76">不因已回复人而漏掉</text>
  <rect x="220" y="574" width="220" height="78" rx="16" fill="#eff8f3" stroke="#8cbca2" stroke-width="1.5"/>
  <text x="330.0" y="622.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="232,580,196,66">旧工具开始</text>
  <rect x="800" y="574" width="400" height="78" rx="16" fill="#eff8f3" stroke="#8cbca2" stroke-width="1.5"/>
  <text x="1000.0" y="608.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="812,580,376,66">旧工具结束，提交结果</text>
  <text x="1000.0" y="638.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="812,580,376,66">作为真实结果只接纳一次</text>
  <rect x="40" y="724" width="1200" height="92" rx="16" fill="#fff8e8" stroke="#c6aa6b" stroke-width="1.5"/>
  <text x="640.0" y="765.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="52,730,1176,80">冻结决定本次能看到什么</text>
  <text x="640.0" y="795.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="52,730,1176,80">结果若在冻结前到达，会与人的输入共同判断；冻结后到达，留到后续决策。</text>
</svg>
