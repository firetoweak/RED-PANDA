<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="756" viewBox="0 0 1280 756" role="img" aria-labelledby="title desc">
  <title id="title">一次模型请求：稳定规则、较早历史、当前保护窗</title>
  <desc id="desc">一次冻结请求包含稳定规则与契约、较早历史、最近行动理由以来的保护窗。只有满足完整成功已读条件的较早结果可缩为引用；新事实在下一次判断才可见。单条超大结果仍受独立外置边界约束。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#708399"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
  </defs>
  <rect width="1280" height="756" fill="#fff"/>
  <!-- Backgrounds, connections and nodes are separate for editable layering. -->
  <rect x="40" y="140" width="1200" height="374" rx="16" fill="#f7f9fb" stroke="#c3ced9" stroke-width="1.5"/>
  <text x="64" y="176" font-size="22" text-anchor="start" font-weight="700" fill="#20354a">本次冻结的请求</text>
  <path d="M500 626 H732" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="616" y="611" font-size="17" text-anchor="middle" font-weight="400" fill="#60758b">进入后续冻结</text>
  <text x="40" y="54" font-size="30" text-anchor="start" font-weight="700" fill="#20354a">一次模型请求：稳定规则、较早历史、当前保护窗</text>
  <text x="40" y="88" font-size="18" text-anchor="start" font-weight="400" fill="#60758b">以下画出一个已存在行动理由的窗口；没有行动理由时，全部可见内容都受保护。</text>
  <rect x="72" y="214" width="288" height="246" rx="16" fill="#f5f2fb" stroke="#b9aad4" stroke-width="1.5"/>
  <text x="216.0" y="304.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="84,220,264,234">稳定规则与契约</text>
  <text x="216.0" y="334.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="84,220,264,234">系统提示</text>
  <text x="216.0" y="362.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="84,220,264,234">截至冻结点已可见的</text>
  <text x="216.0" y="390.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="84,220,264,234">能力目录与工具定义</text>
  <rect x="384" y="214" width="360" height="246" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="564.0" y="304.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="396,220,336,234">较早历史</text>
  <text x="564.0" y="334.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="396,220,336,234">只有完整、成功、已被</text>
  <text x="564.0" y="362.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="396,220,336,234">后续决策读取的工具结果</text>
  <text x="564.0" y="390.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="396,220,336,234">才可缩为原文引用</text>
  <rect x="768" y="214" width="440" height="246" rx="16" fill="#eff8f3" stroke="#8cbca2" stroke-width="1.5"/>
  <text x="988.0" y="304.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="780,220,416,234">当前保护窗</text>
  <text x="988.0" y="334.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="780,220,416,234">最近一条要求决策的外部事实</text>
  <text x="988.0" y="362.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="780,220,416,234">以及此后工具结果原文</text>
  <text x="988.0" y="390.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="780,220,416,234">人的输入、同事请求、子任务回传等</text>
  <text x="776" y="492" font-size="17" text-anchor="start" font-weight="400" fill="#60758b">↑ 仅供观察的通知不移动这个边界</text>
  <rect x="40" y="570" width="460" height="112" rx="16" fill="#fff8e8" stroke="#c6aa6b" stroke-width="1.5"/>
  <text x="270.0" y="621.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="52,576,436,100">冻结后才到达的新事实</text>
  <text x="270.0" y="651.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="52,576,436,100">包括新输入、工具结果与目录变化</text>
  <rect x="732" y="570" width="508" height="112" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="986.0" y="621.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="744,576,484,100">后续判断再读取</text>
  <text x="986.0" y="651.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="744,576,484,100">不会刷新已经在途的模型请求</text>
  <text x="40" y="729" font-size="18" text-anchor="start" font-weight="400" fill="#60758b">单条超大结果仍按外置边界处理；原件可回读，取得引用不等于读过全文。</text>
</svg>
