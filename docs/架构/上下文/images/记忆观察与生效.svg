<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="924" viewBox="0 0 1280 924" role="img" aria-labelledby="title desc">
  <title id="title">记忆先成为观察，再进入冻结的模型请求</title>
  <desc id="desc">记忆修改更新产品当前正文。Bot A 开始判断前读取新正文，先提交完整观察再冻结模型请求；空闲 Bot B 可以仍保留旧观察，不会被更新自动唤醒，下次真实判断才读取届时最新正文。历史观察与摘要不反写产品正文。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#708399"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
  </defs>
  <rect width="1280" height="924" fill="#fff"/>
  <!-- Backgrounds, connections and nodes are separate for editable layering. -->
  <rect x="40" y="358" width="560" height="294" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="64" y="394" font-size="22" text-anchor="start" font-weight="700" fill="#20354a">Bot A 开始新判断</text>
  <rect x="680" y="358" width="560" height="294" rx="16" fill="#f7f9fb" stroke="#c3ced9" stroke-width="1.5"/>
  <text x="704" y="394" font-size="22" text-anchor="start" font-weight="700" fill="#20354a">Bot B 此刻空闲</text>
  <path d="M380 197 H532" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 252 V306 H320 V422" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="434" y="294" font-size="17" text-anchor="middle" font-weight="400" fill="#60758b">先读取，再判断</text>
  <path d="M320 506 V544" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M960 652 V712" fill="none" stroke="#708399" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
  <text x="40" y="54" font-size="30" text-anchor="start" font-weight="700" fill="#20354a">记忆先成为观察，再进入冻结的模型请求</text>
  <text x="40" y="88" font-size="18" text-anchor="start" font-weight="400" fill="#60758b">产品当前正文与每位 Bot 的历史观察各有所有者，更新不自动唤醒空闲 Bot。</text>
  <rect x="40" y="142" width="340" height="110" rx="16" fill="#f7f9fb" stroke="#c3ced9" stroke-width="1.5"/>
  <text x="210.0" y="192.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="52,148,316,98">人或 Bot 显式修改</text>
  <text x="210.0" y="222.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="52,148,316,98">读过版本后整体修订</text>
  <rect x="532" y="142" width="708" height="110" rx="16" fill="#fff8e8" stroke="#c6aa6b" stroke-width="1.5"/>
  <text x="886.0" y="192.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="544,148,684,98">产品记忆当前正文：v2</text>
  <text x="886.0" y="222.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="544,148,684,98">页面与工具读写同一份；只有显式修改改变它</text>
  <rect x="76" y="422" width="488" height="84" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="320.0" y="459.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="88,428,464,72">读取当前正文并提交观察 v2</text>
  <text x="320.0" y="489.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="88,428,464,72">首次或变化时保存完整原文</text>
  <rect x="76" y="544" width="488" height="78" rx="16" fill="#f1f6fc" stroke="#9db8d8" stroke-width="1.5"/>
  <text x="320.0" y="578.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="88,550,464,66">冻结请求使用观察 v2</text>
  <text x="320.0" y="608.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="88,550,464,66">在途请求此后不变</text>
  <rect x="716" y="422" width="488" height="84" rx="16" fill="#f7f9fb" stroke="#c3ced9" stroke-width="1.5"/>
  <text x="960.0" y="459.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="728,428,464,72">最近一次观察仍是 v1</text>
  <text x="960.0" y="489.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="728,428,464,72">这是过去读到的事实</text>
  <text x="960" y="572" font-size="20" text-anchor="middle" font-weight="400" fill="#20354a">更新本身不触发一次模型调用</text>
  <text x="960" y="607" font-size="18" text-anchor="middle" font-weight="400" fill="#60758b">下次真正需要判断时再读取</text>
  <rect x="680" y="712" width="560" height="92" rx="16" fill="#eff8f3" stroke="#8cbca2" stroke-width="1.5"/>
  <text x="960.0" y="753.0" font-size="23" text-anchor="middle" font-weight="700" fill="#20354a" data-bound="692,718,536,80">Bot B 下次判断</text>
  <text x="960.0" y="783.0" font-size="18" text-anchor="middle" font-weight="400" fill="#556779" data-bound="692,718,536,80">读取届时最新正文，提交变化后再冻结</text>
  <text x="40" y="744" font-size="20" text-anchor="start" font-weight="400" fill="#20354a">压缩重述最近观察的原文；</text>
  <text x="40" y="780" font-size="20" text-anchor="start" font-weight="400" fill="#20354a">摘要、请求与重放都不反写产品正文。</text>
  <text x="40" y="868" font-size="18" text-anchor="start" font-weight="400" fill="#60758b">旧观察保留在原位置，变化与清空按顺序追加；观察已提交不等于模型已实际使用。</text>
</svg>
